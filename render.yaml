# Forces this app to deploy as a Docker Web Service (Laravel/PHP),
# not as a Native Node service (which auto-detects package.json).
#
# Important: an existing Node Web Service cannot be converted to Docker.
# Create a NEW Web Service from this Blueprint, or manually create a
# Web Service with Environment = Docker and Dockerfile Path = ./Dockerfile.

services:
  - type: web
    name: dynamic-blog-posting-site
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
